<style>
:root{--bg:#f6f2ea;--ink:#2b2620;--muted:#8a7f72;--accent:#1f6f8b;--line:#e6ddcf}
@media (prefers-color-scheme:dark){:root{--bg:#10151a;--ink:#e8e3d9;--muted:#8f99a5;--accent:#5fb3cf;--line:#2a333d}}
*{box-sizing:border-box}body{margin:0;min-height:100svh;display:flex;align-items:center;justify-content:center;
background:linear-gradient(180deg,rgba(6,22,32,.55),rgba(6,22,32,.35) 50%,rgba(6,22,32,.65)),url(../img/ddcb840ad48c.jpg) center 60%/cover no-repeat,#0f3b52;font-family:-apple-system,BlinkMacSystemFont,'Apple SD Gothic Neo','Malgun Gothic',sans-serif;padding:16px}
.box{width:100%;max-width:340px;background:var(--bg);color:var(--ink);border-radius:16px;padding:32px 24px;text-align:center;box-shadow:0 12px 40px rgba(0,0,0,.25)}
h1{font-size:1.45rem;margin:0 0 .3rem;font-weight:700}p{margin:0 0 1.4rem;color:var(--muted);font-size:.9rem}
input{width:100%;font-size:1.4rem;letter-spacing:.4em;text-align:center;padding:.7rem;border:1px solid var(--line);border-radius:10px;background:transparent;color:var(--ink)}
input:focus{outline:2px solid var(--accent);border-color:transparent}
button{width:100%;margin-top:.8rem;padding:.8rem;font-size:1rem;border:0;border-radius:10px;background:var(--accent);color:#fff;cursor:pointer}
label{display:flex;gap:.4rem;align-items:center;justify-content:center;margin-top:.9rem;font-size:.82rem;color:var(--muted)}
#msg{min-height:1.3em;margin-top:.8rem;font-size:.85rem;color:#c0392b}
</style></head><body><form class="box" id="f"><h1>칠순</h1><p>두 분의 칠순 잔치 영상으로 엮었습니다</p>

<button type="submit">열기</button><label><input type="checkbox" id="keep" style="width:auto"> 이 기기에서 기억하기</label><div id="msg"></div></form>

const b=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));
async function open_(pw){
  const base=await crypto.subtle.importKey('raw',new TextEncoder().encode(pw),'PBKDF2',false,['deriveKey']);
  const key=await crypto.subtle.deriveKey({name:'PBKDF2',salt:b(D.s),iterations:D.i,hash:'SHA-256'},base,{name:'AES-GCM',length:256},false,['decrypt']);
  const html=new TextDecoder().decode(await crypto.subtle.decrypt({name:'AES-GCM',iv:b(D.v)},key,b(D.c)));
  document.open();document.write(html);document.close();
}
const K='chilsun_pw';
document.getElementById('f').onsubmit=async e=>{
  e.preventDefault();const pw=document.getElementById('pw').value,m=document.getElementById('msg'),keep=document.getElementById('keep').checked;
  m.style.color='';m.textContent='여는 중…';
  try{await open_(pw);try{sessionStorage.setItem(K,pw);if(keep)localStorage.setItem(K,pw)}catch(_){}}
  catch(_){m.style.color='#c0392b';m.textContent='비밀번호가 맞지 않습니다';}
};
(async()=>{let s=null;try{s=sessionStorage.getItem(K)||localStorage.getItem(K)}catch(_){}if(s){try{await open_(s)}catch(_){try{localStorage.removeItem(K)}catch(__){}}}})();
</script></body></html>
